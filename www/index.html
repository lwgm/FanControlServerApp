<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>程序控制台 - Vue版</title>
  <link rel="stylesheet" href="styles.css">
  <!-- <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
  <script src="./vue.global.prod.js"></script>
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div class="header-content">
            <div class="header-left">
              <div class="icon-wrapper">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                  <path d="M7 9h10"></path>
                  <path d="M7 15h10"></path>
                </svg>
              </div>
              <div class="header-text">
                <h1 class="title">镜像图标管理</h1>
                <p class="subtitle">输入图标文件路径后点击修改，或者留空路径直接点击修改按钮，立即刷新当前行图标，图标会被复制到其他位置，所以原图标修改成功后可以删掉</p>
              </div>
            </div>

            <button
              type="button"
              class="theme-mode-btn"
              :class="themeMode"
              @click="cycleThemeMode"
              :title="'主题: ' + themeLabel()"
              :aria-label="themeAriaLabel()"
            >
              <span class="theme-icon" aria-hidden="true">
                <svg v-if="themeMode === 'auto'" viewBox="0 0 24 24" class="icon-svg">
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7.6 17.2L12 6.8" stroke-width="1.8" />
                    <path d="M12 6.8L16.4 17.2" stroke-width="1.8" />
                    <path d="M9.2 13.6H14.8" stroke-width="1.8" />
                  </g>
                </svg>
                <svg v-else-if="themeMode === 'light'" viewBox="0 0 24 24" class="icon-svg">
                  <circle cx="12" cy="12" r="4.6" fill="currentColor" />
                  <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <path d="M12 2.4v2.4" />
                    <path d="M12 19.2v2.4" />
                    <path d="M2.4 12h2.4" />
                    <path d="M19.2 12h2.4" />
                    <path d="M5 5l1.7 1.7" />
                    <path d="M17.3 17.3l1.7 1.7" />
                    <path d="M17.3 6.7L19 5" />
                    <path d="M5 19l1.7-1.7" />
                  </g>
                </svg>
                <svg v-else viewBox="0 0 24 24" class="icon-svg">
                  <path d="M16.8 20.1A8.4 8.4 0 1 1 18.6 7.4 7 7 0 1 0 16.8 20.1Z" fill="currentColor" />
                </svg>
              </span>
            </button>
          </div>
        </div>

        <div class="card-content">
          <div class="toolbar-row">
            <label class="input-label">镜像图标列表（{{ iconItems.length }}）</label>
            <p :class="['inline-log', uiLogMessage ? '' : 'is-empty']">{{ uiLogMessage || '占位' }}</p>
          </div>

          <div class="list-shell">
            <div class="loading-mask" v-if="isLoading">正在加载数据...</div>
            <div class="empty-state" v-else-if="!iconItems.length">暂无镜像数据</div>

            <div v-else class="full-list" ref="listContainer">
              <div class="icon-row" v-for="item in iconItems" :key="item.imageName">
                <div class="icon-main">
                  <img
                    class="row-icon"
                    :src="item.iconUrl"
                    :alt="item.imageName"
                    loading="lazy"
                  >
                  <div class="name-block">
                    <p class="image-name">{{ item.imageName }}</p>
                    <p class="icon-name">{{ item.iconName }}</p>
                  </div>
                </div>

                <div class="edit-line">
                  <input
                    type="text"
                    class="path-input"
                    v-model="item.imagePath"
                    placeholder="输入文件路径后点击修改，或留空直接点击修改使用上传并修改"
                    :disabled="item.isSaving"
                    @keydown.enter.prevent="handleChangeIcon(item)"
                  >
                  <button
                    type="button"
                    class="change-btn"
                    :disabled="item.isSaving"
                    @click="handleChangeIcon(item)"
                  >
                    <span>{{ item.isSaving ? '处理中' : '修改' }}</span>
                  </button>
                </div>

                <p v-if="item.errorMessage" class="row-error">{{ item.errorMessage }}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer">
          <p class="footer-text">系统版本 1.0.0</p>
        </div>
      </div>
    </div>

    <div class="page-scrollbar" v-if="showPageScrollbar">
      <div
        :class="['page-scrollbar-thumb', isPageScrolling ? 'is-visible' : '']"
        :style="{ height: pageScrollbarThumbHeight + 'px', transform: 'translateY(' + pageScrollbarThumbTop + 'px)' }"
      ></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
